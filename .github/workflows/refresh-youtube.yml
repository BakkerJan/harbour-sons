name: Refresh YouTube videos

# Pulls the channel's public RSS feed into data/videos.json and commits any
# change. No API key and no quota - the feed is public. The site itself only
# ever reads the committed JSON, so visitors never wait on YouTube.

on:
  schedule:
    - cron: '17 5 * * *'   # daily, 05:17 UTC
  workflow_dispatch:        # or run it by hand after uploading a video

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Standard library only - nothing to install.
      - name: Fetch channel feed
        run: python tools/fetch-youtube.py

      - name: Commit if the feed changed
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "No change in data/videos.json"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "chore: refresh YouTube videos"
          git push
